name: Check and Deploy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: .bun-version
      - uses: actions/cache@v4
        with:
          path: .cache/remote
          key: remote-metadata-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: remote-metadata-v1-
      - run: bun install --frozen-lockfile
      - run: bun run verify
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: site-release
          retention-days: 5
          path: |
            dist/
            scripts/activate-release.py

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    env:
      DEPLOY_TARGET: ${{ secrets.TARGET_DIR }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site-release
      - name: Upload staged release
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: 'dist/*,scripts/activate-release.py'
          target: ${{ env.DEPLOY_TARGET }}.deploy/${{ env.RELEASE_ID }}
      - name: Verify and activate release
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_TARGET,RELEASE_ID
          script: |
            set -eu
            python3 "${DEPLOY_TARGET}.deploy/${RELEASE_ID}/scripts/activate-release.py" "$DEPLOY_TARGET" "$RELEASE_ID"
